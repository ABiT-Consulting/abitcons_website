# Azure DevOps builds the website artifact. The Common / abitcons_website
# classic Release pipeline consumes web-dist and deploys it to IIS on Dev-02.
# Do not deploy this website through cPanel.
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    displayName: Test and package website for IIS
    jobs:
      - job: build
        displayName: Build and verify IIS deployment payload
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - bash: |
              set -euo pipefail
              node --version
              npm --version
              node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
              npm ci
              npm test
              export SEO_LASTMOD="$(awk -F'[<>]' '/<lastmod>/{print $3; exit}' public/sitemap.xml)"
              [[ "$SEO_LASTMOD" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
              npm run build

              # The IIS release consumes this artifact; keep committed dist reproducible.
              git diff --ignore-space-at-eol --exit-code -- dist
              if [ -n "$(git ls-files --others --exclude-standard -- dist)" ]; then
                echo "Untracked dist files detected. Rebuild and commit dist/ on main."
                exit 1
              fi
              test -f dist/index.html
              test -f dist/api/signin.php
              test -f dist/api/support-overview.php
            displayName: Install, test, build, verify website payload

          - task: ArchiveFiles@2
            displayName: Package website for IIS release
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)/dist'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/web-dist.zip'
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/web-dist.zip
            artifact: web-dist
            displayName: Publish IIS deployment package